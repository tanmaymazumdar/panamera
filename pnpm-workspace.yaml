packages:
  - packages/*

onlyBuiltDependencies:
  - esbuild

# Define a catalog of version ranges.
allowBuilds:
  esbuild: true
catalog:
  "@types/node": ^24
  lit: ^3
  oxfmt: ^0
  oxlint: ^1
  tsdown: ^0
  tsx: ^4
  typescript: ^7
  redux: ^5
permissions:
  tsdown:
    skills: true
skills:
  dirs:
    - .agents/skills
    - .claude/skills
    - .cursor/skills
    - .gemini/skills
